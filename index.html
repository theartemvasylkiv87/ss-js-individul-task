<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="#" type="image/x-icon">

<body>
    <header class="header">

    </header>
    <main class="main">
        <section class="form">
            <h2>➕ Додати товар</h2>
            <input type="text" placeholder="Назва товару" id="name">
            <input type="number" placeholder="Ціна" id="price">
            <input type="number" placeholder="Кількість" id="qty">
            <button id="addBtn">Додати</button>
        </section>
        <section class="search">
            <h2>🔍 Пошук</h2>
            <input type="text" placeholder="🔍 Пошук товару" id="searchInput">
        </section>
        <section class="products">
            <h2>🛒 Товари</h2>
            <div id="productsList"></div>
        </section>
    </main>
    <footer class="footer">

    </footer>
    <script src="script.js"></script>
