<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="shortcut icon" href="#" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://unpkg.com/htmx.org@1.9.10"
      integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <header class="header">
      <div class="header-container">
        <div class="logo">
          <span class="logo-icon">⌚</span>
          <span class="logo-text">WatchVault</span>
        </div>

        <nav class="nav">
          <a href="#" class="nav-link" id="inventoryLink">Inventory</a>
          <a href="#" class="nav-link" id="ordersLink">Orders</a>
          <a href="#" class="nav-link" id="cartLink"
            >Cart <span class="cart-count">0</span></a
          >
        </nav>
      </div>
    </header>
    <main class="main">
      <div id="shopView">
        <section class="form">
          <h2 class="form__title">➕ Register New Watch</h2>
          <input
            type="text"
            placeholder="Brand & Model"
            id="name"
            class="form__input form__name"
          />
          <input
            type="number"
            placeholder="Price per unit ($)"
            id="price"
            class="form__input form__price"
          />
          <input
            type="number"
            placeholder="In Stock (pcs)"
            id="qty"
            class="form__input form__quantity"
          />
          <input
            type="text"
            placeholder="Image URL"
            id="image"
            class="form__input form__image"
          />
          <button class="form__button" id="addBtn">Add to Inventory</button>
        </section>

        <section class="inventory">
          <div class="inventory__header">
            <h2>🛒 Current Stock</h2>
            <div class="inventory__actions">
              <select
                id="sortSelect"
                class="search-box__input"
                style="width: auto; margin-right: 10px"
              >
                <option value="default">Default</option>
                <option value="price-desc">Price: High to Low ↓</option>
                <option value="price-asc">Price: Low to High ↑</option>
              </select>

              <div class="search-box">
                <input
                  type="text"
                  placeholder="Filter watches..."
                  id="searchInput"
                  class="search-box__input"
                />
                <span class="search-box__icon">🔍</span>
              </div>
            </div>
          </div>
          <div id="productsList" class="products-list"></div>
        </section>

        <section class="total">
          <h2>💰 Financial Summary</h2>
          <p id="totalPrice">Total Value: $0.00</p>
        </section>
      </div>

      <div id="ordersView" class="orders-view is-hidden">
        <div class="orders-view__container">
          <header class="orders-view__header">
            <h2 class="orders-view__title">📋 Order History</h2>
            <p class="orders-view__subtitle">
              Manage and track your recent purchases
            </p>
          </header>

          <section class="orders-view__content">
            <div id="ordersList" class="orders-list"></div>
          </section>
        </div>
      </div>
    </main>
    <footer class="footer"></footer>

    <div class="cart-overlay" id="cartOverlay"></div>

    <aside class="cart-drawer" id="cartDrawer">
      <div class="cart-drawer__header">
        <h2 class="cart-drawer__title">Your Cart 🛍️</h2>
        <button class="cart-drawer__close" id="closeCartBtn">✖️</button>
      </div>

      <div class="cart-drawer__items" id="cartItems">
        <p class="cart-drawer__empty">Your cart is empty.</p>
      </div>

      <div class="cart-drawer__footer">
        <div class="cart-drawer__total">
          <span class="cart-drawer__total-label">Subtotal:</span>
          <span id="cartTotalPrice" class="cart-drawer__total-value"
            >$0.00</span
          >
        </div>
        <button class="cart-drawer__checkout" id="checkoutBtn">Checkout</button>
      </div>
    </aside>
    <script src="script.js"></script>
  </body>
</html>
